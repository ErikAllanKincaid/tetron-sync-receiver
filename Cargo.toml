[package]
name = "tetron-sync-receiver"
version = "0.11.3"
edition = "2024"
rust-version = "1.91"
license = "MPL-2.0"
description = "Headless home-side rsync receiver for tetron-mobile-sync, managed over the tetron mesh"
repository = "https://github.com/ErikAllanKincaid/tetron-sync-receiver"

[[bin]]
name = "tetron-sync-receiver"
path = "src/main.rs"

[dependencies]
# Floating on tetron's main branch, not a pinned tag -- same reasoning as
# tetron-webui/tetron-systray's own Cargo.toml comments: the real
# compatibility risk is which *binaries* are running together, and
# tetron-proto's wire types already use #[serde(default)] consistently for
# exactly that reason.
tetron-proto = { git = "https://github.com/ErikAllanKincaid/tetron" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "6.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
